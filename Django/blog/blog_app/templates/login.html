{% extends "./base.html" %}

{% load static%}

{% block content %}

<div class="form-container">

    <form method="post">

        {% if error %}
            <p class="error"> {{error}} </p>
        {% endif %}
        <h2 class="form-heading"> Login </h2>

        {% csrf_token %} 

        {{form}}

        <button> Login </button>

    </form>

</div>

{% endblock %}
