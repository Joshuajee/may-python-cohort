{% extends "./base.html" %}

{% load static%}

{% block content %}


{% for post in posts %}
    <div class="post">

        <div class="author-section">
            <img width="50px" height="50px" src="{{post.user.profile_image}}" />
            <div>
                <h2> {{post.title}} </h2>
                <p> {{post.user.first_name}} {{post.user.last_name}} | {{post.date| timesince }} ago | views: {{post.views}}</p>
            </div>
        </div>

   
        <div class="readmore"> 
            <a href="post/{{post.id}}"> <button> Read more </button> </a>
        </div>
    </div>
{% endfor %}

{% endblock %}
